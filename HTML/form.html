<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Form</title>
  </head>
  <body>
    <form>
      <label for="name">Name</label>
      <input id="name" type="text" autofocus placeholder="Enter Your Name" required tabindex="1" />
      <br /><br />
      <label for="age">Age</label>
      <input id="age" type="number" value="18" readonly disabled />
      <br /><br />
      <label for="email">Email</label>
      <input id="email" type="email" tabindex="2" />
      <br /><br />
      <label for="">Contact</label>
      <input type="text" />
      <br /><br />
      <label for="">Password</label>
      <input type="password" />
      <br /><br />
      <label for="">Gender</label>
      <input type="radio" name="gender" />Female
      <input type="radio" name="gender" />Male <br /><br />
      <label for="">Address</label>
      <input type="text" tabindex="3" /><br /><br />
      <label for="">State</label>
      <select name="" id="">
        <option value="">RJ</option>
        <option value="">MP</option>
        <option value="">KR</option>
      </select>
      <br /><br />
      <label for="">Course</label>
      <input type="checkbox" />Full Stack <input type="checkbox" />AI-DS
      <input type="checkbox" />Java <br /><br />
      <label for="">DOB</label>
      <input type="date" />
      <br /><br />
      <label for="">Fav color</label>
      <input type="color" />
      <br /><br />
      <label for="">Progress</label>
      <input type="range" />
      <br /><br />
      <label for="">File</label>
      <input type="file" />
      <br /><br />
      <label for="">Feedback</label>
      <textarea name="" id=""></textarea>
      <br /><br />
      <!-- <button>Submit</button> -->
      <input type="submit" value="Save" />
      <input type="reset" />
    </form>
  </body>
</html>
